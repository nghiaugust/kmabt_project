<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title -->
    <title>{% block title %}KMABT{% endblock %}</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    {% load static %}
    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="{% static 'images/favicon-32x32.png' %}"
    />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}" />
    <link rel="stylesheet" href="{% static 'css/layout.css' %}" />
    <link rel="stylesheet" href="{% static 'css/components.css' %}" />
    <link rel="stylesheet" href="{% static 'css/header.css' %}" />
    <link rel="stylesheet" href="{% static 'css/tables.css' %}" />
    <link rel="stylesheet" href="{% static 'css/overlays.css' %}" />
    <link rel="stylesheet" href="{% static 'css/analysis.css' %}" />
    <link rel="stylesheet" href="{% static 'css/animations.css' %}" />

    <!-- Move to top button styles -->
    <style>
      .move-to-top {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 50px;
        height: 50px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 18px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .move-to-top.show {
        opacity: 1;
        visibility: visible;
      }

      .move-to-top:hover {
        background-color: #0056b3;
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
      }

      .move-to-top:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <header class="site-header" id="stickyHeader">
      <div class="d-flex align-items-center">
        <a
          href="{% url 'home' %}"
          class="d-flex align-items-center text-decoration-none"
        >
          <img
            src="{% static 'images/Logo KMA.png' %}"
            alt="Logo"
            class="logo"
            style="height: 50px; filter: none"
          />
          <span style="color: #fff; font-weight: bold">KMABT</span>
        </a>
      </div>
      <nav>
        <a href="{% url 'home' %}">Home</a>
        <!-- <a href="{% url 'graph' %}">Graph</a> -->
        <!-- <a href="{% url 'scams' %}">Scams</a> -->
        <a href="{% url 'report' %}">Report</a>
        <a href="{% url 'list_report' %}">List Reports</a>
        <a href="#contact">Contact</a>
        <a href="{% url 'introduction' %}">Introduction</a>
        {% if user.is_authenticated %}
        <span style="color: #fff; margin-right: 10px"
          >Hello, {{ user.username }}!</span
        >
        <a href="{% url 'logout' %}">Logout</a>
        {% else %}
        <a href="{% url 'login' %}">Login</a>
        {% endif %}
      </nav>
    </header>

    <!-- Messages section -->
    {% if messages %}
    <div class="container mt-3">
      {% for message in messages %}
      <div
        class="alert alert-{{ message.tags }} alert-dismissible fade show"
        role="alert"
      >
        {{ message }}
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
          aria-label="Close"
        ></button>
      </div>
      {% endfor %}
    </div>
    {% endif %} {% block content %} {% endblock %}

    <!-- Move to top button -->
    <button class="move-to-top" id="moveToTopBtn" title="Move to top">↑</button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/price_service.js' %}"></script>
    <script src="{% static 'js/mempool_service.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
    <script src="{% static 'js/ui_controller.js' %}"></script>
    <script src="{% static 'js/utils.js' %}"></script>

    <!-- Move to top button script -->
    <script>
      // Auto-dismiss alerts after 3 seconds
      document.addEventListener("DOMContentLoaded", function () {
        const alerts = document.querySelectorAll(".alert");
        alerts.forEach(function (alert) {
          setTimeout(function () {
            const bsAlert = new bootstrap.Alert(alert);
            if (bsAlert) {
              bsAlert.close();
            }
          }, 3000); // 3 seconds
        });
      });

      // Get the button
      const moveToTopBtn = document.getElementById("moveToTopBtn");

      // Show/hide button based on scroll position
      window.addEventListener("scroll", function () {
        if (window.pageYOffset > 300) {
          moveToTopBtn.classList.add("show");
        } else {
          moveToTopBtn.classList.remove("show");
        }
      });

      // Smooth scroll to top when button is clicked
      moveToTopBtn.addEventListener("click", function () {
        window.scrollTo({
          top: 0,
          behavior: "smooth",
        });
      });
    </script>
  </body>
</html>
