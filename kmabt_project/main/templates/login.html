<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - KMABT</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
          linear-gradient(
            90deg,
            #0e1a2b 0%,
            #183b5c 25%,
            #1f5c85 50%,
            #183b5c 75%,
            #0e1a2b 100%
          );
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Press Start 2P", monospace;
        color: #e0e0e0;
        zoom: 70%;
        margin: 0;
        padding: 20px;
      }
      .login-container {
        background: rgba(26, 26, 46, 0.4);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 50px;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        max-width: 500px;
        width: 100%;
        text-align: center;
      }
      .login-title {
        color: #fff;
        font-weight: bold;
        text-align: center;
        margin-bottom: 35px;
        font-size: 22px;
        letter-spacing: 0.5px;
      }
      .form-label {
        color: #e0e0e0;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 10px;
        letter-spacing: 0.3px;
        text-align: left;
        display: block;
      }
      .form-control {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        color: #fff;
        font-size: 16px;
        padding: 18px 24px;
        transition: all 0.3s ease;
        font-family: inherit;
        width: 100%;
      }
      .form-control:focus {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(80, 150, 255, 0.5);
        color: #fff;
        box-shadow: 0 0 0 0.2rem rgba(80, 150, 255, 0.15);
      }
      .form-control::placeholder {
        color: #888;
        font-size: 14px;
      }
      .form-check-label {
        color: #e0e0e0;
        font-size: 14px;
        letter-spacing: 0.3px;
      }
      .form-check-input {
        background-color: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.3);
        margin-right: 10px;
      }
      .form-check-input:checked {
        background-color: #5096ff;
        border-color: #5096ff;
      }
      .btn-primary {
        background: linear-gradient(135deg, #5096ff 0%, #3b82f6 100%);
        border: none;
        border-radius: 12px;
        padding: 18px 35px;
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        transition: all 0.3s ease;
        font-family: inherit;
        width: 100%;
        margin-top: 10px;
      }
      .btn-primary:hover {
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(80, 150, 255, 0.3);
      }
      .login-container:hover {
        transform: translateY(-4px);
        border-color: rgba(80, 150, 255, 0.6);
        box-shadow: 0 0 25px rgba(80, 150, 255, 0.4);
      }
      a {
        color: #5096ff;
        font-size: 14px;
        letter-spacing: 0.3px;
        transition: color 0.3s ease;
      }
      a:hover {
        color: #3b82f6;
      }
      .mb-4 {
        margin-bottom: 2rem;
      }
      .mb-3 {
        margin-bottom: 1.5rem;
      }
      .mt-3 {
        margin-top: 1.5rem;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h2 class="login-title">LOGIN TO KMABT</h2>

      <!-- Display messages -->
      {% if messages %} {% for message in messages %}
      <div
        class="alert alert-{{ message.tags }} alert-dismissible fade show"
        role="alert"
      >
        {{ message }}
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
        ></button>
      </div>
      {% endfor %} {% endif %}

      <!-- Login form -->
      <form method="post">
        {% csrf_token %}

        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input
            type="text"
            class="form-control"
            id="username"
            name="username"
            placeholder="Enter your username"
            required
          />
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
          />
        </div>

        <div class="mb-4 form-check text-start">
          <input
            type="checkbox"
            class="form-check-input"
            id="rememberMe"
            name="remember_me"
          />
          <label class="form-check-label" for="rememberMe"> Remember me </label>
        </div>

        <button type="submit" class="btn btn-primary">LOGIN</button>
      </form>

      <div class="mt-3">
        <a href="/" class="text-decoration-none">← Back to Home</a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // Auto-dismiss alerts after 3 seconds
      document.addEventListener("DOMContentLoaded", function () {
        const alerts = document.querySelectorAll(".alert");
        alerts.forEach(function (alert) {
          setTimeout(function () {
            const bsAlert = new bootstrap.Alert(alert);
            bsAlert.close();
          }, 3000); // 3 seconds
        });
      });
    </script>
  </body>
</html>
